<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="fontawesome-free-6.6.0-web/css/all.min.css" />
    <link rel="stylesheet" href="parametre.css" />
    <title>Paramètres - Mon Market</title>
  </head>
  <body>
    <button class="retour">
      <a href="compte.html"
        ><span
          ><i class="fa fa-arrow-left"></i>
          <div>Paramètres</div></span
        >
      </a>
    </button>

    <div class="section-title">Compte & Sécurité</div>

    <div class="options-group">
      <a href="#" class="option-item">
        <span>Sécurité du compte</span>

        <span class="valeur" style="color: green"
          >Protégé <i class="fa fa-chevron-right"></i
        ></span>
      </a>
      <a href="#" class="option-item">
        <span>Changer le mot de passe</span>
        <span class="valeur"><i class="fa fa-chevron-right"></i></span>
      </a>
      <a href="supp.html" class="option-item">
        <span>Supprimer le compte</span>
        <span class="valeur" style="color: #fc1c1c">❯</span>
      </a>
    </div>

    <div class="section-title">Affichage & Langues</div>
    <div class="options-group">
      <div class="option-item">
        <span>Mode Sombre</span>
      </div>

      <div class="option-item">
        <span>Langue de l'application</span>

        <span class="valeur" id="langText"
          >Français <i class="fa fa-chevron-right"></i
        ></span>
      </div>

      <div class="option-item">
        <span>Devise par défaut</span>

        <span class="valeur">MGA (Ar) <i class="fa fa-chevron-right"></i></span>
      </div>
    </div>

    <div class="section-title">Support & Aide</div>
    <div class="options-group">
      <a href="#" class="option-item">
        <span>Centre d'aide</span>
        <span class="valeur">FAQ <i class="fa fa-chevron-right"></i></span>
      </a>

      <a href="#" class="option-item">
        <span>A propos</span>
        <span class="valeur"><i class="fa fa-chevron-right"></i></span>
      </a>

      <div class="option-item">
        <span>Version de l'app</span>
        <span class="valeur">v2.6.1 (2026)</span>
      </div>
    </div>

    <div style="height: 50px"></div>

    <script src="parametre.js"></script>
  </body>
</html>
