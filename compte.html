<!doctype html>

<html lang="fr">
  <head>

        <img src="img/logo.png" alt="Logo" class="logo" />
        <div id="montitre"><span>Mon</span> Market</div>
        <div class="cherche">
          <input type="text" placeholder="Rechercher sur Mon Market..." />
          <button><i class="fa fa-search"></i></button>
        </div>
      </div>

      <nav class="nav-bottom" id="navBottom">
        <a href="home.html" id="iconnav">
          <span><i class="fa fa-bag-shopping"></i></span>
          <div>Produits</div>
        </a>

        <a href="categories.html" id="iconnav">
          <span><i class="fa fa-border-all"></i></span>

        </a>

        <a href="achat.html" id="iconnav">
          <span><i class="fa fa-cart-shopping"></i></span>

        </a>

        <a href="offres.html" id="iconnav">
          <span><i class="fa fa-gift"></i></span>
          <div>Offres</div>
        </a>

        <a
          href="compte.html"
          id="iconnav"
          style="color: #08f2d7; font-weight: bold"
        >
          <span><i class="fa fa-user"></i></span>
          <div>Compte</div>
        </a>
      </nav>

    <main>

          <h1>Mon compte</h1>
          <p>blablala@gmail.compte</p>
        </div>
      </div>

      <div class="menu-gestion">
        <a href="personnel.html" class="option-item">
          <div class="option-text">
            <span><i class="fa fa-user"></i></span>

            <span>Informations personnelles</span>

          <span><i class="fa fa-chevron-right"></i></span>

        <a href="commande.html" class="option-item">
          <div class="option-text">
            <span><i class="fa fa-box"></i></span>

        <a href="#" class="option-item">
          <div class="option-text">
            <span><i class="fa fa-heart"></i></span>

            <span>Mes favoris</span>
          </div>
          <span><i class="fa fa-chevron-right"></i></span>

        <a href="#" class="option-item">
          <div class="option-text">
            <span><i class="fa fa-headset"></i></span>

            <span>Service client</span>
          </div>
          <span><i class="fa fa-chevron-right"></i></span>
        </a>

        <a href="parametre.html" class="option-item">
          <div class="option-text">
            <span><i class="fa fa-gear"></i></span>

            <span>Paramètre</span>

          <span><i class="fa fa-chevron-right"></i></span>
        </a>
